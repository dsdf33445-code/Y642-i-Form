<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Y642 每月定檢表管理與逐級簽核系統</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <!-- SheetJS (xlsx) 用於匯入與匯出 Excel (.xlsx / .xls / .csv) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <!-- html2pdf.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <!-- 自訂樣式表 -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-slate-100 text-slate-800 antialiased selection:bg-blue-600 selection:text-white">

  <!-- ==================== 登入畫面 (未登入時顯示) ==================== -->
  <div id="login-screen" class="fixed inset-0 z-50 bg-slate-900 flex items-center justify-center p-4 overflow-y-auto">
    <div class="bg-white rounded-2xl shadow-2xl border border-slate-200 w-full max-w-md overflow-hidden my-auto">
      <div class="bg-gradient-to-r from-slate-900 via-blue-950 to-slate-900 px-6 py-6 text-white text-center relative">
        <div class="w-14 h-14 rounded-2xl bg-blue-600/90 mx-auto flex items-center justify-center shadow-lg shadow-blue-600/30 mb-3">
          <i class="fa-solid fa-clipboard-check text-2xl"></i>
        </div>
        <h1 class="text-xl font-bold tracking-wide">Y642 每月定檢表簽核系統</h1>
      </div>

      <form id="login-form" onsubmit="App.handleLogin(event)" class="p-6 space-y-4">
        <div id="login-error" class="hidden bg-red-50 border border-red-300 text-red-700 text-xs font-semibold px-3.5 py-2.5 rounded-lg flex items-center gap-2">
          <i class="fa-solid fa-circle-exclamation text-red-600"></i>
          <span id="login-error-text">帳號或密碼錯誤</span>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">登入帳號</label>
          <div class="relative">
            <i class="fa-solid fa-user-shield absolute left-3.5 top-3 text-slate-400 text-sm"></i>
            <input type="text" id="login-account" required placeholder="例如：Y642A 或 209874"
              class="w-full pl-10 pr-3 py-2.5 text-sm border border-slate-300 rounded-xl focus:outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-100 font-mono uppercase" />
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">登入密碼</label>
          <div class="relative">
            <i class="fa-solid fa-lock absolute left-3.5 top-3 text-slate-400 text-sm"></i>
            <input type="password" id="login-password" required placeholder="請輸入密碼"
              class="w-full pl-10 pr-3 py-2.5 text-sm border border-slate-300 rounded-xl focus:outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-100 font-mono" />
          </div>
        </div>

        <button type="submit" class="w-full py-2.5 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-bold rounded-xl shadow-md hover:shadow-lg transition flex items-center justify-center gap-2 text-sm">
          <i class="fa-solid fa-right-to-bracket"></i> 登入系統
        </button>

        <!-- 快速填入帳號區 (僅帶入帳號，不自動填入密碼) -->
        <details class="pt-2 border-t border-slate-200 text-xs text-slate-500">
          <summary class="cursor-pointer font-bold text-slate-600 hover:text-blue-600 select-none">
            <i class="fa-solid fa-circle-info mr-1 text-blue-500"></i>預設帳號一覽（點擊快速帶入帳號）
          </summary>
          <div class="mt-2.5 grid grid-cols-2 gap-1.5 max-h-48 overflow-y-auto pr-1">
            <button type="button" onclick="App.quickFillLogin('209874')" class="text-left px-2.5 py-1.5 rounded-lg bg-amber-50 hover:bg-amber-100 border border-amber-300 text-amber-900">
              <div class="font-bold">鄭毓邦 (最高管理/B股長)</div>
              <div class="text-[10px] font-mono">帳號：209874</div>
            </button>
            <button type="button" onclick="App.quickFillLogin('159038')" class="text-left px-2.5 py-1.5 rounded-lg bg-purple-50 hover:bg-purple-100 border border-purple-200 text-purple-900">
              <div class="font-bold">李宗霖 (課長)</div>
              <div class="text-[10px] font-mono">帳號：159038</div>
            </button>
            <button type="button" onclick="App.quickFillLogin('219691')" class="text-left px-2.5 py-1.5 rounded-lg bg-blue-50 hover:bg-blue-100 border border-blue-200 text-blue-900">
              <div class="font-bold">張育嘉 (A股股長)</div>
              <div class="text-[10px] font-mono">帳號：219691</div>
            </button>
            <button type="button" onclick="App.quickFillLogin('166629')" class="text-left px-2.5 py-1.5 rounded-lg bg-blue-50 hover:bg-blue-100 border border-blue-200 text-blue-900">
              <div class="font-bold">盧帝宏 (C股股長)</div>
              <div class="text-[10px] font-mono">帳號：166629</div>
            </button>
            <button type="button" onclick="App.quickFillLogin('230854')" class="text-left px-2.5 py-1.5 rounded-lg bg-blue-50 hover:bg-blue-100 border border-blue-200 text-blue-900">
              <div class="font-bold">曾苡慈 (D股股長)</div>
              <div class="text-[10px] font-mono">帳號：230854</div>
            </button>
            <button type="button" onclick="App.quickFillLogin('183715')" class="text-left px-2.5 py-1.5 rounded-lg bg-indigo-50 hover:bg-indigo-100 border border-indigo-200 text-indigo-900">
              <div class="font-bold">蘇哲彬 (工程師)</div>
              <div class="text-[10px] font-mono">帳號：183715</div>
            </button>
            <button type="button" onclick="App.quickFillLogin('171504')" class="text-left px-2.5 py-1.5 rounded-lg bg-indigo-50 hover:bg-indigo-100 border border-indigo-200 text-indigo-900">
              <div class="font-bold">林彥廷 (工程師)</div>
              <div class="text-[10px] font-mono">帳號：171504</div>
            </button>
            <button type="button" onclick="App.quickFillLogin('Y642A')" class="text-left px-2.5 py-1.5 rounded-lg bg-emerald-50 hover:bg-emerald-100 border border-emerald-200 text-emerald-900">
              <div class="font-bold">A股技術員 (共用)</div>
              <div class="text-[10px] font-mono">帳號：Y642A</div>
            </button>
            <button type="button" onclick="App.quickFillLogin('Y642B')" class="text-left px-2.5 py-1.5 rounded-lg bg-emerald-50 hover:bg-emerald-100 border border-emerald-200 text-emerald-900">
              <div class="font-bold">B股技術員 (共用)</div>
              <div class="text-[10px] font-mono">帳號：Y642B</div>
            </button>
            <button type="button" onclick="App.quickFillLogin('Y642C')" class="text-left px-2.5 py-1.5 rounded-lg bg-emerald-50 hover:bg-emerald-100 border border-emerald-200 text-emerald-900">
              <div class="font-bold">C股技術員 (共用)</div>
              <div class="text-[10px] font-mono">帳號：Y642C</div>
            </button>
            <button type="button" onclick="App.quickFillLogin('Y642D')" class="text-left px-2.5 py-1.5 rounded-lg bg-emerald-50 hover:bg-emerald-100 border border-emerald-200 text-emerald-900">
              <div class="font-bold">D股技術員 (共用)</div>
              <div class="text-[10px] font-mono">帳號：Y642D</div>
            </button>
            <button type="button" onclick="App.quickFillLogin('Y642E')" class="text-left px-2.5 py-1.5 rounded-lg bg-teal-50 hover:bg-teal-100 border border-teal-200 text-teal-900">
              <div class="font-bold">洪浚豪 (其他)</div>
              <div class="text-[10px] font-mono">帳號：Y642E</div>
            </button>
          </div>
        </details>
      </form>
    </div>
  </div>

  <!-- ==================== 系統主畫面 ==================== -->
  <div id="app-shell" class="hidden flex flex-col h-screen overflow-hidden">

    <!-- 頂部狀態列 -->
    <header class="bg-slate-900 text-white px-3 sm:px-5 py-2.5 flex items-center justify-between shadow-md z-30 shrink-0">
      <div class="flex items-center gap-2.5 min-w-0">
        <div class="w-9 h-9 rounded-xl bg-blue-600 flex items-center justify-center shadow-inner shrink-0">
          <i class="fa-solid fa-bolt-lightning text-base"></i>
        </div>
        <div class="truncate">
          <div class="flex items-center gap-2">
            <h1 class="text-sm sm:text-base font-bold tracking-wide truncate">Y642 每月定檢表簽核系統</h1>
            <span id="sync-status-badge" class="px-2 py-0.5 text-[10px] rounded-full bg-emerald-900/70 text-emerald-300 border border-emerald-700 font-medium shrink-0">
              <i class="fa-solid fa-cloud-check mr-1"></i>本機+雲端就緒
            </span>
          </div>
        </div>
      </div>

      <!-- 右側：當前登入者（只顯示 職位 + 姓名）與登出 -->
      <div class="flex items-center gap-2 sm:gap-3 shrink-0">
        <div class="flex items-center bg-slate-800 border border-slate-700 rounded-xl px-3 py-1.5">
          <span id="current-user-display" class="text-xs font-bold text-white tracking-wide">B股股長 鄭毓邦</span>
        </div>

        <button onclick="App.handleLogout()"
          class="px-3 py-1.5 rounded-lg bg-red-600/90 hover:bg-red-600 text-white text-xs font-bold transition flex items-center gap-1.5 shadow-sm">
          <i class="fa-solid fa-right-from-bracket"></i>
          <span class="hidden sm:inline">登出</span>
        </button>
      </div>
    </header>

    <!-- 主體區：左側桌機導覽列 + 右側模組內容 -->
    <div class="flex flex-1 overflow-hidden relative">

      <!-- 桌機版左側導覽列 -->
      <aside class="hidden md:flex flex-col w-60 bg-slate-900 text-slate-300 border-r border-slate-800 shrink-0 select-none justify-between">
        <div class="p-3 space-y-1.5" id="desktop-nav-list">
          <!-- 由 auth-and-app.js 依據登入角色動態渲染 -->
        </div>

        <!-- 左下角個人電子簽章預覽與資訊 -->
        <div class="p-3.5 m-3 rounded-xl bg-slate-800/90 border border-slate-700/80 space-y-2">
          <div class="flex items-center justify-between">
            <span class="text-[11px] text-slate-400 font-semibold">目前簽核職章預覽</span>
            <span id="sidebar-account-code" class="text-[10px] font-mono text-blue-400">209874</span>
          </div>
          <div id="sidebar-seal-preview" class="bg-white rounded-lg p-2 flex items-center justify-center min-h-[54px] border border-slate-300"></div>
          <div id="sidebar-chain-info" class="text-[11px] text-slate-300 leading-relaxed pt-1 border-t border-slate-700/80"></div>
        </div>
      </aside>

      <!-- 右側動態模組主工作區 -->
      <main class="flex-1 flex flex-col overflow-hidden bg-slate-100 pb-16 md:pb-0">
        <!-- 模組 1：填寫表單 / 待簽核表單 -->
        <section id="view-fill" class="module-view flex-1 flex flex-col overflow-hidden"></section>

        <!-- 模組 2：設計表單 (直接嵌入 EXCEL 試算表) -->
        <section id="view-builder" class="module-view hidden flex-1 flex flex-col overflow-hidden"></section>

        <!-- 模組 3：表單管理 -->
        <section id="view-manage" class="module-view hidden flex-1 flex flex-col overflow-y-auto p-3 sm:p-5"></section>

        <!-- 模組 4：已完成表單 -->
        <section id="view-completed" class="module-view hidden flex-1 flex flex-col overflow-y-auto p-3 sm:p-5"></section>

        <!-- 模組 5：人員管理 (僅鄭毓邦 209874 可進入) -->
        <section id="view-personnel" class="module-view hidden flex-1 flex flex-col overflow-y-auto p-3 sm:p-5"></section>
      </main>

      <!-- 手機版底部導覽列 (RWD) -->
      <nav id="mobile-nav-list" class="md:hidden fixed bottom-0 left-0 right-0 bg-slate-900 text-slate-300 border-t border-slate-800 flex items-center justify-around py-1.5 z-30 shadow-2xl">
        <!-- 由 auth-and-app.js 依據登入角色動態渲染 -->
      </nav>
    </div>
  </div>

  <!-- ==================== A4 PDF 預覽與匯出彈窗 ==================== -->
  <div id="pdf-modal" class="fixed inset-0 z-50 hidden bg-slate-900/80 backdrop-blur-sm flex flex-col">
    <div id="pdf-modal-toolbar" class="bg-slate-900 text-white px-4 py-3 flex flex-wrap items-center justify-between gap-2 border-b border-slate-700 shrink-0">
      <div class="flex items-center gap-2">
        <i class="fa-solid fa-file-pdf text-red-400 text-lg"></i>
        <span class="font-bold text-sm">A4 定檢表預覽與 PDF 匯出</span>
      </div>
      <div class="flex flex-wrap items-center gap-2">
        <select id="pdf-orientation" onchange="App.refreshPdfModal()" class="bg-slate-800 border border-slate-600 rounded-lg px-2.5 py-1 text-xs text-white">
          <option value="portrait">A4 直向 (Portrait)</option>
          <option value="landscape">A4 橫向 (Landscape)</option>
        </select>
        <button onclick="App.downloadPdfFile()" class="px-3 py-1.5 bg-red-600 hover:bg-red-700 text-white rounded-lg text-xs font-bold flex items-center gap-1.5 shadow">
          <i class="fa-solid fa-download"></i> 下載 PDF
        </button>
        <button onclick="window.print()" class="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-xs font-bold flex items-center gap-1.5">
          <i class="fa-solid fa-print"></i> 直接列印
        </button>
        <button onclick="App.closePdfModal()" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-white rounded-lg text-xs font-bold">
          關閉
        </button>
      </div>
    </div>
    <div id="pdf-modal-body" class="flex-1 overflow-auto p-4 sm:p-8 flex justify-center items-start bg-slate-800/90">
      <div id="pdf-render-container" class="a4-sheet portrait bg-white text-black shadow-2xl"></div>
    </div>
  </div>

  <!-- Toast 訊息通知 -->
  <div id="toast-container" class="fixed bottom-16 md:bottom-5 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <!-- ==================== 依序載入分散式 JS 模組 ==================== -->
  <script src="js/config-and-seed.js"></script>
  <script src="js/auth-and-app.js"></script>
  <script src="js/module-fill.js"></script>
  <script src="js/module-builder.js"></script>
  <script src="js/module-manage.js"></script>
  <script src="js/module-completed.js"></script>
  <script src="js/module-personnel.js"></script>
</body>
</html>
